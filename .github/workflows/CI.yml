name: Automated-Build

on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        opts: ["", "HDD=1", "EXFAT=1", "MMCE=1"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip wget texinfo libgmp-dev libmpfr-dev libmpc-dev flex bison gettext autoconf automake libtool

    - name: Install PS2DEV Toolchain
      run: |
        export PS2DEV=/usr/local/ps2dev
        export PS2SDK=$PS2DEV/ps2sdk
        export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2DEV/ps2sdk/bin
        sudo mkdir -p $PS2DEV
        sudo chown $(whoami):$(whoami) $PS2DEV
        git clone https://github.com/ps2dev/ps2dev.git /tmp/ps2dev
        cd /tmp/ps2dev
        ./build-all.sh

    - name: Compile cheat device
      run: |
        export PS2DEV=/usr/local/ps2dev
        export PS2SDK=$PS2DEV/ps2sdk
        export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2DEV/ps2sdk/bin
        make rebuild release ${{ matrix.opts }}

    - name: list
      run: |
        ls -R

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: "${{ github.event.repository.name }}-${{ matrix.opts }}"
        path: release/*.zip

  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.event.repository.name }}/
        pattern: "${{ github.event.repository.name }}-*"
        merge-multiple: true

    - name: list
      run: |
        ls -R

    - name: Create release
      if: github.ref == 'refs/heads/master'
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        title: "Latest automated build"
        files: |
               ${{ github.event.repository.name }}/CheatDevicePS2*.zip