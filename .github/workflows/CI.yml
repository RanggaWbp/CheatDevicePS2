name: Automated-Build
on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types: [run_build]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        opts: ["", "HDD=1", "EXFAT=1", "MMCE=1"]
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0
    permissions:
      contents: read
    steps:
    - name: Install dependencies
      run: |
        apk add --no-cache build-base git zip gcompat libc6-compat libgcc libstdc++ musl-dev
    - name: Static analysis with cppcheck
      run: |
        cppcheck --enable=all --inconclusive src/ 2>/dev/null || true
    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow --tags
    - name: Compile cheat device
      run: |
        make clean && make CFLAGS="-Os -Wall -Wextra -Werror" release ${{ matrix.opts }}
    - name: list
      run: |
        ls -R
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: "${{ github.event.repository.name }}-${{ matrix.opts }}"
        path: release/*.zip

#######################################################
  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.event.repository.name }}/
        pattern: "${{ github.event.repository.name }}-*"
        merge-multiple: true

    - name: list
      run: |
        ls -R

    - name: Set unique release tag
      id: tag
      run: |
        echo "tag=build-$(date +'%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "Build ${{ steps.tag.outputs.tag }}"
        prerelease: false
        make_latest: true
        files: |
          ${{ github.event.repository.name }}/CheatDevicePS2*.zip
